<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Self-Governance Institute | Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1030;--ink:#f2f1ea;--mute:#aeb2d3;--accent:#8fd0b5;--line:#2e3270}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.7 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
main{max-width:640px}
.label{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
h1{font:400 clamp(2.2rem,6vw,3.6rem)/1.15 Fraunces,Georgia,"Times New Roman",serif;margin:0 0 18px}
p{color:var(--mute);margin:0 0 28px}
.btn{display:inline-block;background:var(--accent);color:#0f1030;padding:13px 28px;border-radius:999px;text-decoration:none;font-weight:600}
small{display:block;margin-top:44px;color:var(--mute);font-size:.85rem}
</style>
</head>
<body>
<main>
<span class="label">The Self-Governance Institute</span>
<h1>We’ll be back soon</h1>
<p>Our website is being updated. Thank you for your patience. In the meantime, we’d love to hear from you.</p>
<a class="btn" id="mail" href="#">Contact us</a>
<small>© 2026 The Self-Governance Institute</small>
</main>
<script>
/* EDIT THIS: the email address people should use while the site is offline */
var CONTACT_EMAIL="mariaduque@selfgovernanceinstitute.org";
document.getElementById('mail').href="mailto:"+CONTACT_EMAIL+"?subject="+encodeURIComponent("Message for The Self-Governance Institute");
</script>
</body>
</html>
